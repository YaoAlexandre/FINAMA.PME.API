# version: '3.9'

services:
  # ============================================================================
  # API Finama (Ajoutée pour votre test local)
  # ============================================================================
  finama-api-dev:
    image: finama-api:dev
    build:
      context: .
      dockerfile: Dockerfile.prod # On utilise le même Dockerfile pour tester le comportement de prod
    container_name: finama-api-dev
    restart: unless-stopped
    ports:
      - "10000:10000" # Expose le port pour vos tests locaux (Postman, Swagger)
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:10000
      
      # Connexion à votre PostgreSQL local ci-dessous via le nom du service 'postgres'
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};"
      
      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
      
      Resend__ApiKey: ${Resend__ApiKey}
      EmailSettings__FromEmail: ${EmailSettings__Username}
      EmailSettings__FromName: Finama
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finama-dev-network

  # ============================================================================
  # PostgreSQL - Base de données de développement
  # ============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: finama-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finama-dev-network

  # ============================================================================
  # Redis - Cache & Sessions
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: finama-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - finama-dev-network

  # ============================================================================
  # pgAdmin - Interface Web PostgreSQL
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: finama-pgadmin-dev
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin-dev-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - finama-dev-network

volumes:
  postgres-dev-data:
    driver: local
  redis-dev-data:
    driver: local
  pgadmin-dev-data:
    driver: local

networks:
  finama-dev-network:
    driver: bridge